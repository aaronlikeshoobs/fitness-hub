<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Aaron's Fitness Hub</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Aaron's Fitness Hub" />
<meta name="theme-color" content="#0D1110" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1110;
    --panel:#161C1A;
    --line:#2A332F;
    --text:#EAEFEC;
    --muted:#8CA39A;
    --accent:#4FD9AE;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);height:100%;}
  body{font-family:'Public Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;}
  .wrap{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px 32px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  h1{font-size:30px;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:36px;}
  .tiles{display:flex;flex-direction:column;gap:10px;}
  a.tile{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;text-decoration:none;color:var(--text);
    min-height:64px;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
  }
  a.tile:active{transform:scale(0.97);border-color:var(--accent);background:#1B2320;}
  .tile .icon{
    width:52px;height:52px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(79,217,174,0.12);color:var(--accent);
    font-size:24px;
  }
  .tile .info{flex:1;min-width:0;}
  .tile .name{font-size:17px;font-weight:700;}
  .tile .desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .tile .arrow{color:var(--muted);font-size:22px;flex-shrink:0;}
  footer{text-align:center;padding-top:20px;color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;gap:6px;}

  .today-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
  .today-head{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .today-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .today-row:last-child{border-bottom:none;}
  .today-row .em{font-size:18px;flex-shrink:0;width:24px;text-align:center;}
  .today-row .txt{font-size:13.5px;line-height:1.5;flex:1;}
  .today-row .txt b{font-weight:600;}
  .today-skeleton{color:var(--muted);font-size:13px;font-family:'IBM Plex Mono',monospace;}

  .sync-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:nowrap;}
  .sync-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 6px;white-space:nowrap;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .sync-dot.ok{background:var(--accent);}
  .sync-dot.warn{background:#F2C94C;}
  .sync-dot.bad{background:#FF6B6B;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">💚 Aaron's Fitness Hub</div>
  <div class="today-card">
    <div class="today-head">☀️ Today</div>
    <div id="today-body"><div class="today-skeleton">Checking your apps&hellip;</div></div>
  </div>

  <div class="sync-row" id="sync-row"></div>

  <div class="tiles" id="tiles">
    <a class="tile" id="tile-workout" href="https://aaronlikeshoobs.github.io/workout-log/">
      <div class="icon">🏋️</div>
      <div class="info">
        <div class="name">Training Log</div>
        <div class="desc" id="desc-workout">Weekly program, PRs &amp; weight tracking</div>
      </div>
      <div class="arrow">&rsaquo;</div>
    </a>

    <a class="tile" id="tile-macro" href="https://aaronlikeshoobs.github.io/macro-log/">
      <div class="icon">🍽️</div>
      <div class="info">
        <div class="name">Macro Log</div>
        <div class="desc" id="desc-macro">Daily calories, protein, fat &amp; carbs</div>
      </div>
      <div class="arrow">&rsaquo;</div>
    </a>

    <a class="tile" id="tile-vitals" href="https://aaronlikeshoobs.github.io/vitals-log/">
      <div class="icon">🫀</div>
      <div class="info">
        <div class="name">Vitals Log</div>
        <div class="desc" id="desc-vitals">Body comp, activity &amp; cycling — auto-synced</div>
      </div>
      <div class="arrow">&rsaquo;</div>
    </a>
  </div>

  <footer>🔗 Aaron's Fitness Hub</footer>
</div>

<script>
(function() {
  const todayStr = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };
  const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const todayName = () => DAY_ORDER[(new Date().getDay() + 6) % 7];
  const daysAgo = (dstr) => Math.floor((Date.now() - new Date(dstr + 'T00:00:00').getTime()) / 86400000);

  async function getJSON(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    return res.json();
  }

  // ---- Training: pull program.json + today's logged data ----
  function parseSetsReps(target) {
    const m = (target || '').match(/(\d+)\s*x\s*(\d+)/i);
    return m ? { sets: parseInt(m[1],10), reps: parseInt(m[2],10) } : null;
  }
  async function trainingStatus() {
    const [PROGRAM, data] = await Promise.all([
      getJSON('https://raw.githubusercontent.com/aaronlikeshoobs/workout-log/main/program.json'),
      getJSON('https://raw.githubusercontent.com/aaronlikeshoobs/workout-log/main/data.json').catch(() => ({})),
    ]);
    const weeks = Object.keys(PROGRAM).map(Number).sort((a,b) => a-b);
    const week = weeks[weeks.length - 1];
    const day = PROGRAM[week].days.find(d => d.title === todayName());
    if (!day) return { text: 'No training day scheduled today.', done: true, priority: 0, sub: 'Rest / recovery day' };
    const total = day.exercises.length;
    const done = day.exercises.filter(ex => {
      const log = data[`${week}:${ex.id}`];
      if (!log) return false;
      if (log.sets !== undefined) {
        const sr = parseSetsReps(ex.target);
        return sr ? log.sets.length >= sr.sets : log.sets.length > 0;
      }
      return !!log.done; // bodyweight/cardio exercises stay checkbox-based
    }).length;
    if (done === total) {
      return { text: `<b>${day.focus}</b> — all ${total} exercises logged. Nice work.`, done: true, priority: 0 };
    }
    return {
      text: `<b>${day.focus}</b> — ${done}/${total} logged. ${done === 0 ? "Haven't started yet." : 'Keep going.'}`,
      done: false,
      priority: 2,
    };
  }

  // ---- Macros: today's protein/cal vs target ----
  async function macroStatus() {
    const data = await getJSON('https://raw.githubusercontent.com/aaronlikeshoobs/macro-log/main/data.json');
    const today = todayStr();
    const entries = (data.entries || []).filter(e => e.date === today && e.kind !== 'symptom' && e.status !== 'pending' && e.status !== 'estimating');
    const t = entries.reduce((a,e) => ({ cal: a.cal+(e.cal||0), protein: a.protein+(e.protein||0) }), { cal:0, protein:0 });
    const presetKey = data.dayTypes && data.dayTypes[today];
    const tg = (presetKey && data.targetPresets && data.targetPresets[presetKey])
      || (data.targetPresets && data.targetPresets.standard)
      || data.targets
      || { cal: 1750, protein: 170 };
    const proteinLeft = tg.protein - t.protein;
    const calLeft = tg.cal - t.cal;
    const hour = new Date().getHours();
    const behindLate = proteinLeft > 20 && hour >= 14;
    if (entries.length === 0 && hour < 10) {
      return { text: `Nothing logged yet today. Target: <b>${tg.protein}g protein</b>, ${tg.cal} kcal.`, priority: behindLate ? 1 : 0 };
    }
    if (proteinLeft <= 0) {
      return { text: `Protein target hit (${t.protein}/${tg.protein}g). ${calLeft > 0 ? calLeft + ' kcal remaining.' : calLeft + ' kcal over.'}`, priority: 0 };
    }
    return {
      text: `<b>${proteinLeft}g protein</b> to go (${t.protein}/${tg.protein}g) &middot; ${calLeft} kcal remaining`,
      priority: behindLate ? 1 : 0,
    };
  }

  // ---- Vitals: only surface if something's actually stale/notable ----
  async function vitalsStatus() {
    const data = await getJSON('https://raw.githubusercontent.com/aaronlikeshoobs/vitals-log/main/data.json');
    const KEY = ['weight', 'resting_hr', 'hrv'];
    let staleMetric = null, maxStale = 0;
    KEY.forEach(id => {
      const hist = (data[id] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
      const latest = hist[hist.length - 1];
      if (latest) {
        const age = daysAgo(latest.date);
        if (age > maxStale) { maxStale = age; staleMetric = id; }
      }
    });
    if (maxStale > 3) {
      const label = { weight: 'Weight', resting_hr: 'Resting HR', hrv: 'HRV' }[staleMetric];
      return { text: `⚠️ ${label} hasn't synced in <b>${maxStale} days</b> — worth a check.`, priority: 3, notable: true };
    }
    return { text: 'All key metrics synced recently. Nothing urgent.', priority: -1, notable: false };
  }

  function row(emoji, html) {
    return `<div class="today-row"><div class="em">${emoji}</div><div class="txt">${html}</div></div>`;
  }

  async function build() {
    const results = await Promise.allSettled([trainingStatus(), macroStatus(), vitalsStatus()]);
    const [tr, mc, vt] = results.map(r => r.status === 'fulfilled' ? r.value : null);

    // TODAY card
    const todayBody = document.getElementById('today-body');
    let html = '';
    html += row('🏋️', tr ? tr.text : "Couldn't reach Training Log — check your connection.");
    html += row('🍽️', mc ? mc.text : "Couldn't reach Macro Log — check your connection.");
    if (vt && vt.notable) html += row('🫀', vt.text);
    todayBody.innerHTML = html || '<div class="today-skeleton">Nothing to flag right now.</div>';

    if (tr) document.getElementById('desc-workout').textContent = tr.done ? 'Done for today' : "Today's session isn't finished";
    if (mc) document.getElementById('desc-macro').textContent = mc.priority >= 1 ? 'Protein behind target' : 'On track for today';
    if (vt) document.getElementById('desc-vitals').textContent = vt.notable ? 'Something needs a look' : 'Body comp, activity & cycling — auto-synced';

    // Dynamic tile order
    const priorities = {
      workout: tr ? tr.priority : 0,
      macro: mc ? mc.priority : 0,
      vitals: vt ? vt.priority : -1,
    };
    const order = Object.keys(priorities).sort((a,b) => priorities[b] - priorities[a]);
    const tilesEl = document.getElementById('tiles');
    order.forEach(key => tilesEl.appendChild(document.getElementById('tile-' + key)));

    // Sync-health pills
    const syncRow = document.getElementById('sync-row');
    const pill = (label, state) => `<div class="sync-pill"><span class="sync-dot ${state}"></span>${label}</div>`;
    let pills = '';
    pills += pill('Training', tr ? 'ok' : 'bad');
    pills += pill('Macro', mc ? 'ok' : 'bad');
    pills += pill('Vitals', vt ? (vt.notable ? 'warn' : 'ok') : 'bad');
    syncRow.innerHTML = pills;
  }

  build();
})();
</script>
</body>
</html>
